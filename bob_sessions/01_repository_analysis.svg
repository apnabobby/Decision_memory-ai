<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="bob-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Terminal Window -->
  <rect x="50" y="40" width="1100" height="595" rx="12" fill="#030712" stroke="#1f2937" stroke-width="2"/>
  
  <!-- Terminal Header -->
  <rect x="50" y="40" width="1100" height="44" rx="12" fill="#111827"/>
  <circle cx="80" cy="62" r="6" fill="#ef4444"/>
  <circle cx="102" cy="62" r="6" fill="#f59e0b"/>
  <circle cx="124" cy="62" r="6" fill="#10b981"/>
  <text x="550" y="68" fill="#9ca3af" font-family="monospace" font-size="13" text-anchor="middle">IBM Bob 2.0 Agent — Task 01: Repository Architecture Analysis</text>

  <!-- Content -->
  <g font-family="monospace" font-size="14" fill="#e5e7eb">
    <text x="80" y="125" fill="#3b82f6" font-weight="bold">ibm-bob-2.0 &gt; analyze-repository --depth=full --target=cloudscale-infra/core-api</text>
    
    <text x="80" y="160" fill="#10b981">[BOB AGENT MODE] Initiating Codebase &amp; Architecture Intelligence</text>
    <text x="80" y="190" fill="#6b7280">Scanning AST, Git commit history, pull request bodies, issues, and ADR documents...</text>
    
    <!-- Analysis Box -->
    <rect x="80" y="215" width="1040" height="380" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    
    <text x="110" y="255" fill="#f3f4f6" font-weight="bold">Repository Diagnostic Matrix:</text>
    <text x="110" y="285" fill="#9ca3af">• Git Commits Analyzed: <tspan fill="#60a5fa" font-weight="bold">1,420 commits</tspan> spanning 18 months</text>
    <text x="110" y="315" fill="#9ca3af">• Merged Pull Requests: <tspan fill="#60a5fa" font-weight="bold">388 PRs</tspan> (containing 1,290 review comments)</text>
    <text x="110" y="345" fill="#9ca3af">• Resolved Issues: <tspan fill="#60a5fa" font-weight="bold">512 tickets</tspan> (incident logs, RFC discussions)</text>
    <text x="110" y="375" fill="#9ca3af">• Architecture Decision Records: <tspan fill="#60a5fa" font-weight="bold">24 ADRs</tspan> in /docs/adr/</text>

    <text x="110" y="420" fill="#f59e0b" font-weight="bold">Identified Developer Pain Points:</text>
    <text x="110" y="450" fill="#e5e7eb">1. [Knowledge Fragmentation] 72% of architectural reasoning resides only in PR discussions, not code.</text>
    <text x="110" y="480" fill="#e5e7eb">2. [Citation Gap] Junior devs repeatedly re-propose previously rejected tools (e.g. Memcached, Kafka).</text>
    <text x="110" y="510" fill="#e5e7eb">3. [Search Silos] Manual correlation between an Issue ticket, ADR, and resulting Commit takes ~45 minutes.</text>

    <text x="110" y="555" fill="#10b981" font-weight="bold">✓ IBM Bob Synthesis: Formulated unified schema for Decision Memory AI knowledge graph.</text>
  </g>
</svg>
