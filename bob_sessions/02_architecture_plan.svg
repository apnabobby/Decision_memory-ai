<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg2)"/>
  
  <rect x="50" y="40" width="1100" height="595" rx="12" fill="#030712" stroke="#1f2937" stroke-width="2"/>
  <rect x="50" y="40" width="1100" height="44" rx="12" fill="#111827"/>
  <circle cx="80" cy="62" r="6" fill="#ef4444"/>
  <circle cx="102" cy="62" r="6" fill="#f59e0b"/>
  <circle cx="124" cy="62" r="6" fill="#10b981"/>
  <text x="550" y="68" fill="#9ca3af" font-family="monospace" font-size="13" text-anchor="middle">IBM Bob 2.0 Subagents — Task 02: Architecture &amp; Implementation Planning</text>

  <g font-family="monospace" font-size="14" fill="#e5e7eb">
    <text x="80" y="125" fill="#3b82f6" font-weight="bold">ibm-bob-2.0 &gt; plan-architecture --enforce-citation-safety --target-runtime=node-react</text>
    
    <text x="80" y="160" fill="#10b981">[SUBAGENT: Architecture Planner] Generating System Blueprint</text>
    
    <!-- Architecture Diagram Box -->
    <rect x="80" y="195" width="1040" height="405" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    
    <!-- Boxes for Pipeline -->
    <rect x="110" y="230" width="200" height="90" rx="6" fill="#1f2937" stroke="#3b82f6" stroke-width="2"/>
    <text x="210" y="265" fill="#60a5fa" font-weight="bold" text-anchor="middle">1. User Query</text>
    <text x="210" y="290" fill="#9ca3af" font-size="12" text-anchor="middle">"Why was Redis chosen?"</text>

    <!-- Arrow -->
    <path d="M 320 275 L 360 275" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="340" y="265" fill="#60a5fa" font-size="11" text-anchor="middle">→</text>

    <rect x="370" y="230" width="220" height="90" rx="6" fill="#1f2937" stroke="#8b5cf6" stroke-width="2"/>
    <text x="480" y="265" fill="#c084fc" font-weight="bold" text-anchor="middle">2. Grounded Retrieval</text>
    <text x="480" y="290" fill="#9ca3af" font-size="12" text-anchor="middle">Match ADR + PR + Commit</text>

    <text x="600" y="265" fill="#8b5cf6" font-size="11" text-anchor="middle">→</text>

    <rect x="630" y="230" width="220" height="90" rx="6" fill="#1f2937" stroke="#10b981" stroke-width="2"/>
    <text x="740" y="265" fill="#34d399" font-weight="bold" text-anchor="middle">3. Decision Graph</text>
    <text x="740" y="290" fill="#9ca3af" font-size="12" text-anchor="middle">Link Nodes &amp; Edges</text>

    <text x="860" y="265" fill="#10b981" font-size="11" text-anchor="middle">→</text>

    <rect x="890" y="230" width="200" height="90" rx="6" fill="#1f2937" stroke="#f59e0b" stroke-width="2"/>
    <text x="990" y="265" fill="#fbbf24" font-weight="bold" text-anchor="middle">4. Cited Answer</text>
    <text x="990" y="290" fill="#9ca3af" font-size="12" text-anchor="middle">Separates Evidence &amp; AI</text>

    <!-- Rules Section -->
    <text x="110" y="365" fill="#f3f4f6" font-weight="bold">Core Architectural Constraints Enforced by IBM Bob:</text>
    <text x="110" y="395" fill="#ef4444">⚠ Citation Safety Invariant:</text>
    <text x="360" y="395" fill="#d1d5db">AI is strictly prohibited from fabricating PR numbers, commit hashes, or URLs.</text>
    
    <text x="110" y="430" fill="#3b82f6">ℹ Fallback Invariant:</text>
    <text x="360" y="430" fill="#d1d5db">If query lacks evidentiary grounding, return: "Insufficient evidence to determine reasoning".</text>
    
    <text x="110" y="465" fill="#10b981">✓ Decision Graph Schema:</text>
    <text x="360" y="465" fill="#d1d5db">Nodes: Decision, Reason, Alternative, Rejected, Author, PR, Commit, Issue, Doc, Timeline.</text>

    <text x="110" y="500" fill="#8b5cf6">⚡ Tech Stack Selection:</text>
    <text x="360" y="500" fill="#d1d5db">React 19, TypeScript 7, Vite, Tailwind CSS, Express API layer, Gemini SDK.</text>

    <text x="110" y="555" fill="#10b981" font-weight="bold">✓ IBM Bob Architecture Plan Approved: Proceeding to parallel feature implementation.</text>
  </g>
</svg>
