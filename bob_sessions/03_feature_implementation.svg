<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg3)"/>
  
  <rect x="50" y="40" width="1100" height="595" rx="12" fill="#030712" stroke="#1f2937" stroke-width="2"/>
  <rect x="50" y="40" width="1100" height="44" rx="12" fill="#111827"/>
  <circle cx="80" cy="62" r="6" fill="#ef4444"/>
  <circle cx="102" cy="62" r="6" fill="#f59e0b"/>
  <circle cx="124" cy="62" r="6" fill="#10b981"/>
  <text x="550" y="68" fill="#9ca3af" font-family="monospace" font-size="13" text-anchor="middle">IBM Bob 2.0 Parallel Tasks — Task 03: Feature Implementation</text>

  <g font-family="monospace" font-size="14" fill="#e5e7eb">
    <text x="80" y="125" fill="#3b82f6" font-weight="bold">ibm-bob-2.0 &gt; implement --mode=parallel --components=all</text>
    
    <text x="80" y="155" fill="#10b981">[PARALLEL SUBAGENTS DEPLOYED: 4 WORKERS]</text>
    
    <rect x="80" y="180" width="1040" height="425" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    
    <!-- Worker 1 -->
    <rect x="110" y="210" width="490" height="85" rx="6" fill="#161b22" stroke="#238636" stroke-width="1"/>
    <text x="130" y="240" fill="#34d399" font-weight="bold">Worker 1: Frontend UI &amp; Ask WHY Flow</text>
    <text x="130" y="265" fill="#9ca3af" font-size="12">✓ Built Dashboard, Ask WHY query interface, status steppers, preset queries.</text>

    <!-- Worker 2 -->
    <rect x="620" y="210" width="470" height="85" rx="6" fill="#161b22" stroke="#238636" stroke-width="1"/>
    <text x="640" y="240" fill="#34d399" font-weight="bold">Worker 2: Decision Graph Engine</text>
    <text x="640" y="265" fill="#9ca3af" font-size="12">✓ Interactive SVG/Canvas graph with node highlights, filtering, and zoom.</text>

    <!-- Worker 3 -->
    <rect x="110" y="310" width="490" height="85" rx="6" fill="#161b22" stroke="#238636" stroke-width="1"/>
    <text x="130" y="340" fill="#34d399" font-weight="bold">Worker 3: Evidence Extraction &amp; Citations</text>
    <text x="130" y="365" fill="#9ca3af" font-size="12">✓ Categorized Git commits, PR threads, Issues, ADRs with exact excerpts.</text>

    <!-- Worker 4 -->
    <rect x="620" y="310" width="470" height="85" rx="6" fill="#161b22" stroke="#238636" stroke-width="1"/>
    <text x="640" y="340" fill="#34d399" font-weight="bold">Worker 4: Express API &amp; Gemini Grounding</text>
    <text x="640" y="365" fill="#9ca3af" font-size="12">✓ Server endpoints /api/query, /api/sources, /api/decisions with JSON schema.</text>

    <!-- Summary Box -->
    <rect x="110" y="415" width="980" height="155" rx="6" fill="#111827" stroke="#1f2937"/>
    <text x="130" y="445" fill="#f3f4f6" font-weight="bold">Build Metrics:</text>
    <text x="130" y="475" fill="#9ca3af">• Total Components Generated: <tspan fill="#60a5fa">12 modular TypeScript files</tspan></text>
    <text x="130" y="505" fill="#9ca3af">• Strict Type Coverage: <tspan fill="#10b981">100% (No 'any' in core interfaces)</tspan></text>
    <text x="130" y="535" fill="#9ca3af">• Design Compliance: <tspan fill="#c084fc">Tailwind CSS dark enterprise developer theme</tspan></text>
