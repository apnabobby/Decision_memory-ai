<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg4)"/>
  
  <rect x="50" y="40" width="1100" height="595" rx="12" fill="#030712" stroke="#1f2937" stroke-width="2"/>
  <rect x="50" y="40" width="1100" height="44" rx="12" fill="#111827"/>
  <circle cx="80" cy="62" r="6" fill="#ef4444"/>
  <circle cx="102" cy="62" r="6" fill="#f59e0b"/>
  <circle cx="124" cy="62" r="6" fill="#10b981"/>
  <text x="550" y="68" fill="#9ca3af" font-family="monospace" font-size="13" text-anchor="middle">IBM Bob 2.0 Debugger — Task 04: Debugging &amp; Type-Safety Hardening</text>

  <g font-family="monospace" font-size="14" fill="#e5e7eb">
    <text x="80" y="125" fill="#3b82f6" font-weight="bold">ibm-bob-2.0 &gt; debug --strict --verify-null-safety</text>
    
    <text x="80" y="155" fill="#f59e0b">[BOB DIAGNOSTIC SCAN] Analyzing Edge Cases and Failure Modes...</text>
    
    <rect x="80" y="180" width="1040" height="425" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    
    <!-- Item 1 -->
    <text x="110" y="220" fill="#ef4444" font-weight="bold">RESOLVED 01: Offline &amp; Quota Exhaustion Guard</text>
    <text x="110" y="245" fill="#9ca3af">Issue: If Gemini API key is missing or quota is exhausted, frontend could hang or show blank.</text>
    <text x="110" y="270" fill="#10b981">Bob Fix: Implemented automatic fallback to local semantic search matching across raw repository dataset.</text>

    <!-- Item 2 -->
    <text x="110" y="315" fill="#ef4444" font-weight="bold">RESOLVED 02: JSON Schema Validation &amp; Sanitization</text>
    <text x="110" y="340" fill="#9ca3af">Issue: LLMs occasionally wrap JSON in markdown backticks or omit optional fields.</text>
    <text x="110" y="365" fill="#10b981">Bob Fix: Strict sanitization regex + responseSchema enforcement + typed default fallbacks for all fields.</text>

    <!-- Item 3 -->
    <text x="110" y="410" fill="#ef4444" font-weight="bold">RESOLVED 03: Decision Graph Edge Alignment</text>
    <text x="110" y="435" fill="#9ca3af">Issue: Overlapping nodes in dense decisions when rendering multiple authors and commits.</text>
    <text x="110" y="460" fill="#10b981">Bob Fix: Hierarchical level-based force layout algorithm with category-colored badges and interactive focus.</text>

    <!-- Item 4 -->
    <text x="110" y="505" fill="#10b981" font-weight="bold">LINT &amp; TYPECHECK RESULTS:</text>
    <text x="110" y="535" fill="#e5e7eb">tsc --noEmit: <tspan fill="#10b981" font-weight="bold">0 errors</tspan> | Vite build: <tspan fill="#10b981" font-weight="bold">Pass</tspan> | Runtime crash hazards: <tspan fill="#10b981" font-weight="bold">0</tspan></text>
    <text x="110" y="570" fill="#3b82f6">✓ All diagnostic invariants satisfied. Application hardened against unexpected runtime inputs.</text>
  </g>
</svg>
